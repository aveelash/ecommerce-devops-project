# CI/CD for Product-Catalog Service
name: product-catalog-ci

# Triggers
on:
  pull_request:
    branches:
      - main      # PRs to main branch
  push:
    branches:
      - main      # Only push to main triggers Docker build & k8s update

# Jobs
jobs:

  # -----------------------
  # Build and Test (for PRs)
  # -----------------------
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Build
        run: |
          cd src/product-catalog
          go mod download
          go build -o product-catalog-service main.go

      - name: Run Unit Tests
        run: |
          cd src/product-catalog
          go test ./...

      - name: Run GolangCI-Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@@v1.56.2
          golangci-lint run src/product-catalog/...

  # -----------------------
  # Docker Build & Push (for main)
  # -----------------------
  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-v2:${{ github.sha }}

  # -----------------------
  # Update Kubernetes Deployment (for main)
  # -----------------------
  updatek8s:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Docker Image in k8s manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog-v2:${{ github.sha }}|" kubernetes/productcatalog/deploy.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Aveelash Hota"
          git config --global user.email "aveelash.hota04@gmail.com"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI]: Update product-catalog image tag" || echo "No changes to commit"
          git push
